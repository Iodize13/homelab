apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: synapse
spec:
  selector:
    matchLabels:
      app: synapse
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: synapse
    spec:
      initContainers:
      - name: fix-log-config
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          LOG_CFG="/data/matrix.ionize13.com.log.config"
          if [ -f "$LOG_CFG" ]; then
            if grep -q '/data/homeserver.log' "$LOG_CFG"; then
              echo "Log config already patched"
            else
              sed -i "s|/homeserver.log|/data/homeserver.log|g" "$LOG_CFG"
              echo "Patched log config to use /data/homeserver.log"
            fi
          else
            echo "WARNING: log config not found at $LOG_CFG"
          fi
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - image: matrixdotorg/synapse:v1.153.0
        name: synapse
        # args: ["generate"]
        # env:
        # - name: SYNAPSE_SERVER_NAME
        #   value: "example.org"
        # - name: SYNAPSE_REPORT_STATS
        #   value: "yes"
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
          - containerPort: 8008
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: synapse-pv-claim

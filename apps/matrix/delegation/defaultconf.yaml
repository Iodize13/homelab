apiVersion: v1
kind: ConfigMap
metadata:
  name: delegation-conf
  namespace: synapse
data:
  default.conf: |
    server {
      listen       80;

      location /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server": "matrix.ionize13.com:443"}';
      }
      location /.well-known/matrix/client {
        default_type application/json;
        return 200 '{"m.homeserver": { "base_url": "https://matrix.ionize13.com" }}';
      }
      location / {
        proxy_pass http://synapse-service.synapse.svc.cluster.local:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
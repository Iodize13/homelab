apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: stash-cluster
  namespace: stash
spec:
  instances: 1
  bootstrap:
    initdb:
      database: stash
      owner: stash
  storage:
    size: 2Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"

# Minimal Argo CD for a shared single-node cluster (memory is tight).
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 192Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 64Mi}
